<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Task 3 — Café Reservation</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <header class="site-header">
        <nav class="navbar navbar-dark container" aria-label="Main navigation">
            <a class="navbar-brand fw-bold" href="index.html">A4 Forms</a>
            <a class="nav-link" href="index.html">Back to tasks</a>
        </nav>
    </header>

    <main class="container py-4 py-lg-5">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <section class="ticket-card" aria-labelledby="reserve-title">
                    <div class="card-heading">
                        <h1 id="reserve-title">Reserve a table</h1>
                        <p>We will keep your table ready.</p>
                    </div>

                    <form class="p-3 p-md-4" action="#" method="post">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label" for="guest-name">Your name</label>
                                <input class="form-control" id="guest-name" name="guest-name" type="text"
                                    autocomplete="name" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="guest-email">Email</label>
                                <input class="form-control" id="guest-email" name="guest-email" type="email"
                                    autocomplete="email" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="guest-phone">Phone</label>
                                <input class="form-control" id="guest-phone" name="guest-phone" type="tel"
                                    autocomplete="tel" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="guests">Guests</label>
                                <input class="form-control" id="guests" name="guests" type="number" min="1" max="20"
                                    step="1" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label" for="reservation-date">Date</label>
                                <input class="form-control" id="reservation-date" name="reservation-date" type="date"
                                    required>
                            </div>

                            <fieldset class="col-md-6">
                                <legend class="form-label fs-6">Seating</legend>
                                <div class="d-flex gap-3 pt-2">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="seating" id="inside"
                                            value="inside" required>
                                        <label class="form-check-label" for="inside">Inside</label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="seating" id="terrace"
                                            value="terrace">
                                        <label class="form-check-label" for="terrace">Terrace</label>
                                    </div>
                                </div>
                            </fieldset>

                            <div class="col-md-6">
                                <label class="form-label" for="meal">Meal</label>
                                <select class="form-select" id="meal" name="meal">
                                    <option value="lunch">Lunch</option>
                                    <option value="dinner">Dinner</option>
                                </select>
                            </div>

                            <div class="col-12">
                                <label class="form-label" for="comments">Comments</label>
                                <textarea class="form-control" id="comments" name="comments" rows="4"
                                    placeholder="Tell us anything helpful"></textarea>
                            </div>

                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                                    <label class="form-check-label" for="terms">
                                        I agree to the reservation terms.
                                    </label>
                                </div>
                            </div>

                            <div class="col-12">
                                <button class="btn btn-primary" type="submit">Reserve</button>
                            </div>
                        </div>
                    </form>
                </section>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">Accessible keyboard-friendly reservation form</div>
    </footer>
</body>

</html>
